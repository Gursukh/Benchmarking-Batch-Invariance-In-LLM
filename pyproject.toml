[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "batch_invariance_bench"
version = "0.1.0"
description = "Benchmark harness for measuring variance from batch-invariance solutions in vLLM."
requires-python = ">=3.10"
dependencies = [
    "vllm==0.20.2",
    "torch",
    "transformers",
    "datasets",
    "pandas",
    "math-verify",
    # Runtime deps of the vendored IFEval checker (tasks/_ifeval/).
    "nltk",
    "langdetect",
    "immutabledict",
]

[project.optional-dependencies]
fxpr = ["fxpr_vllm"]

[project.scripts]
nondet = "nondet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
